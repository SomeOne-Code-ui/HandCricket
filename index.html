<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Cricket: Championship Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --neon: #00d4ff; --gold: #ffd700; --red: #ff4b2b; --bg: #0a0f12; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px; overflow: hidden; }
        .container { background: #162127; border: 2px solid var(--neon); border-radius: 15px; padding: 30px; max-width: 400px; margin: auto; position: relative; z-index: 2; }
        .score-board { font-size: 4rem; font-weight: bold; color: var(--neon); text-shadow: 0 0 10px rgba(0,212,255,0.5); }
        
        /* Overlays for Win/Loss */
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10; flex-direction: column; justify-content: center; align-items: center; }
        .win-text { color: var(--gold); font-size: 3rem; text-transform: uppercase; animation: pulse 1s infinite; }
        .lose-text { color: var(--red); font-size: 3rem; text-transform: uppercase; }
        
        input { width: 80px; padding: 15px; border-radius: 8px; border: none; font-size: 1.5rem; text-align: center; margin-bottom: 15px; background: #23343d; color: white; }
        button { background: var(--neon); border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
        .reset-btn { background: #333; color: #888; margin-top: 20px; font-size: 0.7rem; width: auto; padding: 5px 10px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="overlay">
        <div id="overlay-content"></div>
        <button onclick="resetStadium()" style="margin-top: 20px; width: 200px;">PLAY AGAIN</button>
    </div>

    <div class="container">
        <h2 id="header">HAND CRICKET</h2>
        <div id="role" style="color: #888; margin-bottom: 10px;">Assigning Role...</div>
        <div class="score-board" id="score">0</div>
        <div id="log" style="margin-bottom: 20px; font-style: italic;">Waiting for game to start...</div>
        
        <input type="number" id="moveInput" min="1" max="10" placeholder="1-10">
        <button onclick="makeMove()">STRIKE!</button>
        
        <button class="reset-btn" onclick="resetStadium()">HARD RESET STADIUM</button>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBKC58hNDqYtOG4AYJWQ3atgdSHQCOmTbg",
        authDomain: "handcricket-bd145.firebaseapp.com",
        databaseURL: "https://handcricket-bd145-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "handcricket-bd145",
        storageBucket: "handcricket-bd145.firebasestorage.app",
        messagingSenderId: "537606735022",
        appId: "1:537606735022:web:3a11ef2ed659895e26993f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let myRole = ""; 

    db.ref('game/players').transaction((current) => {
        if (current === null) {
            myRole = "bat";
            document.getElementById('role').innerText = "STANCE: BATTING";
            return { p1: "active" };
        } else if (!current.p2) {
            myRole = "bowl";
            document.getElementById('role').innerText = "STANCE: BOWLING";
            return { ...current, p2: "active" };
        }
        return current; 
    });

    function makeMove() {
        const val = parseInt(document.getElementById('moveInput').value);
        if (isNaN(val) || val < 1 || val > 10) return alert("Pick 1-10!");
        db.ref('game/moves/' + myRole).set(val);
        document.getElementById('moveInput').value = "";
        document.getElementById('log').innerText = "Waiting for reveal...";
    }

    db.ref('game/moves').on('value', (snap) => {
        const moves = snap.val();
        if (moves && moves.bat && moves.bowl) {
            if (moves.bat === moves.bowl) {
                showEndScreen(document.getElementById('score').innerText);
            } else {
                if (myRole === 'bat') db.ref('game/totalScore').transaction(s => (s || 0) + moves.bat);
                document.getElementById('log').innerText = `Bat: ${moves.bat} | Bowl: ${moves.bowl}`;
                db.ref('game/moves').set(null);
            }
        }
    });

    db.ref('game/totalScore').on('value', (s) => document.getElementById('score').innerText = s.val() || 0);

    function showEndScreen(finalScore) {
        const overlay = document.getElementById('overlay');
        const content = document.getElementById('overlay-content');
        overlay.style.display = 'flex';
        
        if (myRole === 'bowl') {
            content.innerHTML = `<div class="win-text">VICTORY!</div><p>You got the Batsman OUT!</p>`;
        } else {
            content.innerHTML = `<div class="lose-text">BOWLED OUT!</div><p>Final Score: ${finalScore}</p>`;
        }
    }

    function resetStadium() {
        db.ref('game').remove().then(() => location.reload());
    }
</script>
</body>
</html>

<script>
    // YOUR FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyBKC58hNDqYtOG4AYJWQ3atgdSHQCOmTbg",
        authDomain: "handcricket-bd145.firebaseapp.com",
        projectId: "handcricket-bd145",
        storageBucket: "handcricket-bd145.firebasestorage.app",
        messagingSenderId: "537606735022",
        appId: "1:537606735022:web:3a11ef2ed659895e26993f"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let myRole = ""; 

    // 1. Assign Role (First to join is Bat, second is Bowl)
    db.ref('game/players').transaction((current) => {
        if (current === null) {
            myRole = "bat";
            document.getElementById('role').innerText = "YOU ARE: BATTING";
            return { p1: "active" };
        } else if (!current.p2) {
            myRole = "bowl";
            document.getElementById('role').innerText = "YOU ARE: BOWLING";
            return { ...current, p2: "active" };
        }
        return current; 
    });

    // 2. Sending Move
    function makeMove() {
        const val = parseInt(document.getElementById('moveInput').value);
        if (isNaN(val) || val < 1 || val > 10) {
            alert("Pick a number between 1 and 10!");
            return;
        }
        db.ref('game/moves/' + myRole).set(val);
        document.getElementById('moveInput').value = "";
        document.getElementById('log').innerText = "Move sent! Waiting for opponent...";
    }

    // 3. Listen for Match result
    db.ref('game/moves').on('value', (snapshot) => {
        const moves = snapshot.val();
        if (moves && moves.bat && moves.bowl) {
            const bat = moves.bat;
            const bowl = moves.bowl;

            if (bat === bowl) {
                alert(`OUT! Both chose ${bat}. Match Over!`);
                db.ref('game').remove(); // Clear game
                location.reload();
            } else {
                if (myRole === 'bat') {
                    db.ref('game/totalScore').transaction(s => (s || 0) + bat);
                }
                document.getElementById('log').innerText = `Last Ball: Bat(${bat}) vs Bowl(${bowl})`;
                db.ref('game/moves').remove(); // Clear moves for next ball
            }
        }
    });

    // 4. Update Scoreboard
    db.ref('game/totalScore').on('value', (s) => {
        document.getElementById('score').innerText = s.val() || 0;
    });
</script>
